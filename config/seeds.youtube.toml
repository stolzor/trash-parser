# Конфиг сбора. Хранение отделено от ml: данные идут в S3/MinIO (см. [storage]),
# а не в каталог ml. out_root — только нейтральный локальный путь под staging/FS-режим.
out_root = "./data"

[manifest]
# Состояние сбора (статусы стадий) в PostgreSQL (см. docker-compose.yml, порт 5433).
# Можно переопределить env DATABASE_URL.
url = "postgres://postgres:postgres@127.0.0.1:5433/detox"

[storage]
backend = "s3"             # данные → объектное хранилище (отдельно от ml). "fs" — локально.

[storage.s3]
bucket = "detox-bronze"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"   # MinIO/R2; убрать (закомментировать) для AWS S3
prefix = "bronze"
path_style = true                     # обязательно для MinIO
staging_dir = "./.staging"            # локальный временный буфер медиа до загрузки
# Креды — только из env: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY

[concurrency]
# Пока нет чистых IP (residential в [proxy]) — держим темп низким: с одного
# серверного IP пачка параллельных запросов триггерит бот-гейт (см. ADR-0005).
# Появится residential → можно вернуть meta_workers=4, requests_per_sec=2.
meta_workers = 1        # параллельных задач метаданных на платформу (внутри процесса)
media_workers = 1       # параллельных скачиваний
requests_per_sec = 1    # rate-limit на платформу (бережно, против гейта по объёму)
claim_batch = 50        # размер батча захвата из очереди (меньше → лучше делёж между воркерами)

[media]
# Метаданные-first: все 9 ML-полей приходят из `-J`, медиа для датасета не нужно
# (ADR-0004). Скачивание — гигабайты и лишний повод для гейта → выключено.
# Включи (download = true), когда будет отдельный маршрут (residential для меты
# + [proxy.media] direct для видео).
download = false
format = "worst[ext=mp4]/worst"   # capped low-res (хватает для фич ml)
max_filesize = "100M"
long_windows = 4                  # длинные видео качаем N окнами, а не целиком (0 = целиком)
long_window_seconds = 30.0        # длина окна (синхр. с ml LONG_WINDOW_SECONDS)

[discovery]
max_hops = 1                # 0 = только seeds; >0 = расширять по каналам (анти-survivorship-bias)
expand_channel_videos = 40  # сколько аплоадов брать с одного канала при расширении
max_channels_per_hop = 80   # предел каналов за один хоп
gate_before_media = true
min_duration_s = 3.0

[quota]
# Балансировка обучающего набора: предел скачиваний медиа по доменам.
# Закомментируй или убери, чтобы не ограничивать.
short = 500    # видео ≤90с
long = 500     # видео >90с

[proxy]
# Файл со списком прокси (один URL на строку: http://[user:pass@]host:port, socks5://…).
# Ротация round-robin + экспоненциальный cooldown на сбойных. Применяется и к
# yt-dlp, и к нативным reqwest-клиентам (InnerTube/TikTok-web).
# Для YouTube сюда ставят rotating residential: метаданные (`-J`) — килобайты,
# по трафику копейки, а чистые IP снимают бот-гейт (см. ADR-0005).
# file = "./config/proxies.txt"
# cooldown_base_secs = 30
# Раздельный маршрут под скачивание медиа (гигабайты) — чтобы НЕ гнать видео
# через дорогой residential. Без секции медиа идёт через [proxy].
# [proxy.media]
# direct = true                     # качать напрямую, мимо пула (рекомендуется для YouTube)
# file = "config/datacenter.txt"    # ИЛИ свой дешёвый датацентр-пул под гигабайты

[tiktok]
# Cookie для нативного TikTok-discovery (msToken/ttwid повышают шанс обойти бот-стену).
# Приоритет: cookie > cookie_file > cookies_from_browser.
# cookie = "msToken=...; ttwid=...; sessionid=..."   # готовая строка заголовка
# cookie_file = "tiktok_cookies.txt"                 # Netscape cookies.txt (как у yt-dlp)
# cookies_from_browser = "chrome"   # авто-экспорт куки браузера через yt-dlp (покрывает
                                     # и нативный SSR, и yt-dlp-fallback одной настройкой)

[ytdlp]
# YouTube бот-гейтит скачивание медиа ("confirm you're not a bot").
# Раскомментируй одно из двух, чтобы качать медиа:
# cookies_from_browser = "firefox"          # брать куки из браузера
# cookies_file = "/path/to/cookies.txt"    # или Netscape cookies.txt

# ─────────────────────────────────────────────────────────────────────────────
# Источники (Stage 0) под «Dopamine Index». Цель — не «хорошие видео», а
# РЕПРЕЗЕНТАТИВНОСТЬ + РАЗНООБРАЗИЕ обоих полюсов, чтобы модель училась структуре
# дофаминовости, а не теме/длине. YouTube-only (TikTok — внизу, под residential).
#
#   • high-dopamine (short): разные ТИПЫ стимуляции, не только "satisfying".
#   • low-dopamine (long): опора на channel-сиды (полные ленты) + max_hops —
#     берём и «обычные» видео канала, а не только залетевшие (анти-survivorship).
#   • target щедрый: метаданные дёшевы (download=false), собираем вширь.
# ─────────────────────────────────────────────────────────────────────────────

# ═══ HIGH-DOPAMINE (short, ≤90с) — YouTube Shorts, разные типы стимуляции ═══
[[seeds]]
platform = "youtube"
kind = "query"
value = "oddly satisfying shorts"
domain_hint = "short"
target = 60

