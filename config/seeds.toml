# Конфиг сбора. Хранение отделено от ml: данные идут в S3/MinIO (см. [storage]),
# а не в каталог ml. out_root — только нейтральный локальный путь под staging/FS-режим.
out_root = "./data"

[manifest]
# Состояние сбора (статусы стадий) в PostgreSQL (см. docker-compose.yml, порт 5433).
# Можно переопределить env DATABASE_URL.
url = "postgres://postgres:postgres@127.0.0.1:5433/detox"

[storage]
backend = "s3"             # данные → объектное хранилище (отдельно от ml). "fs" — локально.

[storage.s3]
bucket = "detox-bronze"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"   # MinIO/R2; убрать (закомментировать) для AWS S3
prefix = "bronze"
path_style = true                     # обязательно для MinIO
staging_dir = "./.staging"            # локальный временный буфер медиа до загрузки
# Креды — только из env: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY

[concurrency]
meta_workers = 4        # параллельных задач метаданных на платформу (внутри процесса)
media_workers = 2       # параллельных скачиваний
requests_per_sec = 2    # rate-limit на платформу
claim_batch = 50        # размер батча захвата из очереди (меньше → лучше делёж между воркерами)

[media]
download = true
format = "worst[ext=mp4]/worst"   # capped low-res (хватает для фич ml)
max_filesize = "100M"
long_windows = 4                  # длинные видео качаем N окнами, а не целиком (0 = целиком)
long_window_seconds = 30.0        # длина окна (синхр. с ml LONG_WINDOW_SECONDS)

[discovery]
max_hops = 1                # 0 = только seeds; >0 = расширять по каналам (анти-survivorship-bias)
expand_channel_videos = 30  # сколько аплоадов брать с одного канала при расширении
max_channels_per_hop = 50   # предел каналов за один хоп
gate_before_media = true
min_duration_s = 3.0

[quota]
# Балансировка обучающего набора: предел скачиваний медиа по доменам.
# Закомментируй или убери, чтобы не ограничивать.
short = 500    # видео ≤90с
long = 500     # видео >90с

[proxy]
# Файл со списком прокси (один URL на строку: http://[user:pass@]host:port, socks5://…).
# Ротация round-robin + экспоненциальный cooldown на сбойных. Применяется и к
# yt-dlp, и к нативным reqwest-клиентам (InnerTube/TikTok-web).
file = "./config/proxies.txt"
cooldown_base_secs = 30

[tiktok]
# Cookie для нативного TikTok-discovery (msToken/ttwid повышают шанс обойти бот-стену).
# Приоритет: cookie > cookie_file > cookies_from_browser.
# cookie = "msToken=...; ttwid=...; sessionid=..."   # готовая строка заголовка
# cookie_file = "tiktok_cookies.txt"                 # Netscape cookies.txt (как у yt-dlp)
# cookies_from_browser = "chrome"   # авто-экспорт куки браузера через yt-dlp (покрывает
                                     # и нативный SSR, и yt-dlp-fallback одной настройкой)

[ytdlp]
# YouTube бот-гейтит скачивание медиа ("confirm you're not a bot").
# Раскомментируй одно из двух, чтобы качать медиа:
# cookies_from_browser = "firefox"          # брать куки из браузера
# cookies_file = "/path/to/cookies.txt"    # или Netscape cookies.txt

# --- Источники (Stage 0). Балансируем оба домена и оба уровня вовлечённости. ---

# short-домен (high-dopamine)
[[seeds]]
platform = "youtube"
kind = "query"
value = "shorts satisfying"
domain_hint = "short"
target = 40

[[seeds]]
platform = "tiktok"
kind = "hashtag"
value = "fyp"
domain_hint = "short"
target = 40

# long-домен (low-dopamine) — полные аплоады канала против survivorship bias
[[seeds]]
platform = "youtube"
kind = "channel"
value = "@lexfridman"
domain_hint = "long"
target = 20

[[seeds]]
platform = "youtube"
kind = "query"
value = "full podcast episode interview"
domain_hint = "long"
target = 30
