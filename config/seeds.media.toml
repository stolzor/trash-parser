# ─────────────────────────────────────────────────────────────────────────────
# КОНФИГ ТОЛЬКО ДЛЯ MEDIA-СТАДИИ (скачивание видео на сервер B).
#
#   detox-parser media --config config/seeds.media.toml
#
# Запускается на сервере A (где парсер и Postgres). Читает задания из общего
# манифеста (Postgres на A), качает медиа и кладёт в MinIO на сервере B.
# Метаданные (raw/meta) НЕ трогаются — они уже на A. Сиды не нужны: media-стадия
# не занимается discovery, берёт уже собранные видео со status_media='pending'.
#
# ⚠ Перед запуском: сначала `make media-estimate` — прикинь объём и реши, что
#   качать (short целиком дёшев; long тяжёлый → окнами).
# ─────────────────────────────────────────────────────────────────────────────

out_root = "./data"

[manifest]
# Тот же Postgres, что и при сборе метаданных (на сервере A, docker :5433).
url = "postgres://postgres:postgres@127.0.0.1:5433/detox"

[storage]
backend = "s3"
[storage.s3]
bucket = "detox-media"
region = "us-east-1"
# ⬇⬇⬇ ПРАВЬ: IP/hostname СЕРВЕРА B в локальной сети ⬇⬇⬇
endpoint = "http://192.168.1.2:9000"   # MinIO на сервере B (deploy/docker-compose.media.yml)
prefix = "media"
path_style = true
staging_dir = "./.staging"             # временный буфер на A (файл удаляется после заливки)
# Креды MinIO сервера B — из env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# (dev: minioadmin/minioadmin — те же, что в config/detox.env).

[media]
download = true                        # ← media-стадия качает
# 240p достаточно для потоковых признаков (монтаж/движение/цвет/аудио) — ADR-0007.
# Нужны лица/экранный текст → подними до height<=360.
format = "worst[height<=240][ext=mp4]/worst[height<=240]/worst"  # ≤240p, mp4 приоритет
max_filesize = "300M"                  # предохранитель от аномально больших файлов
long_windows = 3                       # long качаем 3 окнами (начало/сер/конец) — минимум под стиль
long_window_seconds = 20.0             # 3×20с=60с сэмпла на long-видео

[quota]
# Баланс датасета 1:1 (ADR-0007). short — минорный класс и «потолок» выборки:
# качаем ВСЕ short (не лимитируем), а long ограничиваем ИМЕННО числом собранных
# short, чтобы классы были равны.
#   short: закомментировано = без лимита (скачать все short — они дёшевы).
#   long : поставь = текущему числу short ПЕРЕД запуском media-run.
#          Узнать: make status → строка meta ok для short (или запрос ниже).
# SELECT count(*) FROM videos WHERE status_meta='ok' AND duration_s<=90;
# short = 100000   # без лимита; раскомментируй с большим числом, если нужен потолок
long = 4200        # ← ВЫРОВНЯЙ по факту: = числу собранных short на момент скачивания

[concurrency]
media_workers = 2                      # параллельных скачиваний
requests_per_sec = 2
claim_batch = 50
